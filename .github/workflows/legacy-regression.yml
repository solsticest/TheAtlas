name: Legacy regression

on:
  push:
    branches:
      - feat/react-atlas-migration
  pull_request:
    branches:
      - main

jobs:
  legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run legacy regression suite
        env:
          ATLAS_TEST_PYTHON: python
        run: node tests/regression.cjs
      - name: Run main-folder suite
        run: node tests/main-folder.cjs
