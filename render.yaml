services:
  - type: web
    name: the-atlas
    runtime: node
    branch: main
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: if [ -f storage/render-storage.tgz ]; then tar -tzf storage/render-storage.tgz >/dev/null && tar -xzf storage/render-storage.tgz -C storage && rm storage/render-storage.tgz; fi && npm run db:setup && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:../../../storage/atlas.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
    disk:
      name: atlas-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 5
